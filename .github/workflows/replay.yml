name: JD Health Coin Replay

on:
  schedule:
    - cron: '*/5 0-7 * * *'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      CK: ${{ secrets.CK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run replay script
        run: python replay.py
